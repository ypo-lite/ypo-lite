# Builds the zip and the installer.
#
# On a release/* tag: also creates a draft GitHub release to review and publish.
# By hand (Actions > release > Run workflow): builds only, and keeps the files as
# a workflow artifact. Run it on main before tagging: release tags are immutable,
# so a tag whose build fails cannot be moved to a fixed commit.
name: release

on:
  push:
    tags: ["release/*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      # Not on the runner image for certain: pinned and installed explicitly.
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build the zip and the installer
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: ./scripts/release.ps1 -Tag $env:TAG

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Apart from the build, so that the only job holding a write token never
  # checks out or runs anything from the repository.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Ypo-Lite ${TAG#release/}" \
            --generate-notes
