[workspace]
resolver = "3"
members = ["core", "y-coustic", "y-pop", "y-snap", "y-snap-config", "y-term"]
# The skeleton is a self-contained reference copy, not a workspace member:
# it must keep building on its own when copied out of the repository.
exclude = ["skeleton"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
y-core = { path = "core" }
embed-resource = "3.0.11"
windows-reactor = "0.100"

# One feature set for the whole workspace: the `windows` crate is compiled
# once and shared by every application.
[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
